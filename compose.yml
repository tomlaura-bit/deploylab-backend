services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: deploylab
      POSTGRES_USER: deploylab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y configura DB_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["deploylab-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploylab -d deploylab"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/deploylab
      DB_USER: deploylab
      DB_PASSWORD: ${DB_PASSWORD}
      INSTRUCTOR_EMAIL: ${INSTRUCTOR_EMAIL}
      INSTRUCTOR_PASSWORD: ${INSTRUCTOR_PASSWORD}
      MAIL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  deploylab-data:
