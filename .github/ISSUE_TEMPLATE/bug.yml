name: Error
description: Documentar un comportamiento incorrecto reproducible
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Incluye ruta, rol, entrada y estado previo.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
