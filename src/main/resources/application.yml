spring:
  application:
    name: deploylab
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deploylab}}
    username: ${DB_USER:deploylab}
    password: ${DB_PASSWORD:deploylab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  health.mail.enabled: ${MAIL_ENABLED:false}
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  extras-enabled: ${EXTRAS_ENABLED:true}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  instructor-email: ${INSTRUCTOR_EMAIL:}
  instructor-password: ${INSTRUCTOR_PASSWORD:}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@deploylab.local}
  s3-bucket: ${S3_BUCKET:}
  s3-region: ${AWS_REGION:us-east-1}
  jobs-delay: 1000
  jwt-secret: ${JWT_SECRET:deploylab-local-development-secret-change-before-production-2026}
  jwt-access-minutes: ${JWT_ACCESS_MINUTES:15}
  jwt-refresh-days: ${JWT_REFRESH_DAYS:7}
