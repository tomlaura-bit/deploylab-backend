<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>{{title}}</title></head>
<body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center" style="padding:32px 16px">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:12px;overflow:hidden">
        <tr><td style="background:#1e3a8a;color:#fff;padding:24px 32px"><strong style="font-size:22px">DeployLab</strong></td></tr>
        <tr><td style="padding:32px">
          <h1 style="font-size:22px;margin:0 0 16px">{{title}}</h1>
          <p style="font-size:16px;line-height:1.6;margin:0">{{message}}</p>
        </td></tr>
        <tr><td style="padding:18px 32px;background:#eef2ff;font-size:13px">Mensaje automático de la plataforma educativa DeployLab.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
